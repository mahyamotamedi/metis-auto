# Paid routing benchmark P-1..P-3 (final sprint plan 2026-11-01, "Paid branch";
# owner of the tasks: Parham). Read by wiring.benchmark and
# scripts/benchmark.py. Decisions: docs/adr/0053-paid-benchmark-p1-p3.md
# (ADR-0053). Format of the label export:
# docs/evaluation/benchmark_labels.md.
#
# Owner values were set on 2026-11-04 (each marked "Owner decision 2026-11-04
# (Q-nn)"); the questions and answers are in docs/guides/benchmark_pilot.md
# section 0. Code that needs a value still refuses with "set by owner: <key>"
# if it is removed (tests use a temporary copy with one value removed);
# `scripts/benchmark.py plan --estimate --with-db` prints the computed estimate.
version = "benchmark-p1p3-2026-11-03"

[set]
# P-1 set: golden-v2 instead of a new 300-request report-period sample
# (draft ADR point 1): its gpt-5.5 reference answers already exist (ADR-0030).
dataset_id = "golden-v2"
reference_run_id = "ga-v2-20261101"
reference_model = "gpt-5.5"
# ID-only export committed by golden-v2 (no text): the tenant check reads it.
shareable_ids = "reports/evaluation/golden_v2/golden_v2_shareable.parquet"
# Review Focus 5 / S-3: no tenant above 35% of any sample.
tenant_cap = 0.35
# Cohorts that pool many accounts (config/evaluation/golden_v1.toml [caps]:
# "Remaining accounts" pools 127 accounts). Reported apart, never as one tenant.
pooled_cohorts = ["Remaining accounts"]

[pilot]
# Final plan P-1: "a 20-request pilot first (discarded from results)".
size = 20
seed = "p1-pilot-2026-11-04"

[reference]
# Catalogue and price files of this benchmark (ADR-0053 amendment 5): the
# hash-locked live defaults stay as they are; these copies add
# deepseek-v4.1-flash and disable gpt-4.1-nano and mimo-v2.5.
catalogue = "reference/catalogue-metis-test-2026-11-04-v41.toml"
prices = "reference/prices-metis-2026-11-04-v41.toml"

[arms]
# The plan's callable test models (P-1). gpt-5.5 is the reference: its answers
# exist (ADR-0030) and are never requested again. The logged answer (free) is
# not wired yet. JEV is a decision model, never an answering arm.
# 2026-11-04 (ADR-0053 amendment 5): only callable models are requested;
# gpt-4.1-nano and mimo-v2.5 stay listed under [arms.not_callable] below.
requested = ["gpt-5-nano", "gpt-4o-mini", "deepseek-v4-flash"]

[arms.not_callable]
# Evidence: router live check (R6) and the owner's probe, 2026-11-03
# (docs/references/jev_model_note.md; TODO-17, Q-42). The catalogue flags are
# the catalogue owner's change; until it lands, this list keeps them out.
"gpt-4.1-nano" = "not callable on Metis: HTTP 404 model_not_found ('The model gpt-4.1-nano has been deprecated'), live check 2026-11-03 (TODO-17), again 2026-11-04 (docs/references/metis_model_availability_2026-11-04.md)"
"mimo-v2.5" = "not callable on Metis: HTTP 400 'Unsupported model mimo-v2.5' in every request shape, live check 2026-11-03 (Q-42), HTTP 400 again 2026-11-04 (docs/references/metis_model_availability_2026-11-04.md)"
"jev-latest" = "decision model, not a chat model: never an answering arm (jev_model_note.md)"

[gates]
# Paid-branch gate 2 (final plan): Metis allows sending samples to model APIs
# (O-1, the licence question). Owner sets true only with a written answer.
# Owner decision 2026-11-04 (O-1): the gate is open.
metis_allows_samples = true
metis_answer_ref = "Project owner confirmed 2026-11-04 that Metis answered in writing: samples may be sent to model APIs. The written answer is held by the owner."

[spend_share]
# Decision 7: one shared spend total across the machines' ledgers. Each machine
# exports a content-free summary (scripts/spend_share.py export) into
# summaries_dir; a paid run counts every other machine's newest summary.
summaries_dir = "reports/spend/ledgers"
# Owner decision 2026-11-04 (Q-64): one label per machine whose summary counts.
# Owner decision 2026-11-04 (chat, main run): do not wait for parham and mahya;
# the machines whose summaries count are kimia (exported) and saba (this run's
# own ledger). Q-64 had listed four; restore them if they make live calls.
# The team total stays under the 92 USD ceiling and the owner's 80 USD budget.
expected_machines = ["kimia", "saba"]
# Owner decision 2026-11-04 (Q-64): how old a summary may be, in hours.
max_age_hours = 24

[run]
# Owner decisions (overview §5 item 4; plan "run cap and stop rules").
# Owner decision 2026-11-04 (Q-62): this benchmark's share of the 92 USD ceiling.
hard_cap_usd = "35"
# Owner decision 2026-11-04 (Q-63): generation limit per answer (as the golden answers).
max_output_tokens = 8192
# Owner decision 2026-11-04 (Q-63): seed of the call-order shuffle.
order_seed = "p1-order-2026-11-04"

[judges]
# Owner decisions: two models from different provider families (plan P-2).
# Owner decision 2026-11-04 (Q-63): two models from different provider families
# (OpenAI, DeepSeek). CAVEAT: both are also answering arms (cheap_arms below), so
# self-preference is possible; the 60-item human spot-check is the control.
# 2026-11-04 (ADR-0053 amendment 5): the DeepSeek judge is deepseek-v4.1-flash
# (accepted by the wrapper under its own ID; it reports the same model name,
# deepseek-flash, as deepseek-v4-flash). Needs thinking = "disabled" in
# config/local.toml [model_options] (config/local.example.toml). Scores of the
# earlier judge are separate files (judging/deepseek-v4-flash.*), never mixed.
models = ["gpt-4o-mini", "deepseek-v4.1-flash"]
# Owner decision 2026-11-04 (Q-63): judge reply limit (strict JSON, short).
max_output_tokens = 64
# Owner decision 2026-11-04 (Q-63): instruction language.
instruction_language = "en"

[labels]
# Owner decisions (δ / thresholds, ADR-0006 vs the PDF rule).
# Owner decision 2026-11-04 (Q-63): pairwise score vs gpt-5.5 at or above =
# acceptable. Fixed BEFORE any result existed (decision rules are written before
# results; it must not be changed after seeing scores).
acceptable_score = 0.5
# Owner decision 2026-11-04 (Q-63): arms whose acceptability defines cheap_ok.
cheap_arms = ["gpt-5-nano", "gpt-4o-mini", "deepseek-v4-flash"]

[gate]
# Persian gate for the judges (E5 GateConfig), checked on the spot-check by
# `benchmark.py agreement`. Owner decisions; all unset = labels say not_configured.
# agreement_statistic = "cohen_kappa"   # or "accuracy"
# min_agreement = ...
# min_items = ...

[spot_check]
# Final plan P-2: "a 60-item human spot-check by the team".
size = 60
seed = "p2-spot-2026-11-04"
