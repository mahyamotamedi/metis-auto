# Price table for decision-router backends (ADR-XXXX (system-one-decision-router)): System-One models
# called as router overhead, never as answering models. Same schema as the
# answering-model price files (docs/architecture/token_accounting.md §4), kept
# apart so the answering-model table and its version do not change.
#
# Source: Metis pricing page https://docs.metisai.ir/pricing, checked by the
# project owner on 2026-11-02 (family "typesafe", model "jev-latest").
# TypeSafe's own direct price is NOT used anywhere (owner decision 2026-11-02).
# Output tokens are priced at zero but still counted and reported (input and
# output stay separate rows of the same price_ref).
#
# A change in price = a new dated file with a new version, never an edit of
# this one. Amounts are decimal STRINGS, USD per 1,000,000 tokens.
# effective_from: unknown (the page states none).

version = "prices-metis-router-2026-11-02"
currency = "USD"
per_tokens = 1000000

[evidence]
source = "Metis pricing page https://docs.metisai.ir/pricing (family typesafe, model jev-latest), checked by the project owner 2026-11-02"
checked_on = 2026-11-02

[[prices]]
price_ref = "metis-jev-latest"
input = "0.0462"
output = "0.0000"
