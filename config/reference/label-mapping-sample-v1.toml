# Logged model labels of the sample (dataset sample_v1) → catalogue models,
# for the as-logged baseline (Stage 8; contracts.md §4, evaluation.md §5).
#
# Labels are operational metadata, not content. They are NOT billing
# entities (A-07): even an exact ID says nothing about the snapshot served
# at log time (March–September 2026, naive timestamps), and the prices used
# are the Metis prices of 2026-10-18, not those in force when the answer was
# logged. Every as-logged cost is therefore an estimate and says so.
#
# fidelity: exact_id (label = catalogue model ID) | alias (documented alias;
#           whether it applied at log time is unknown).
# unmapped: not_in_catalogue (a real model with no catalogue row or price) |
#           not_a_model (names no model, A-16).
# A label missing from this file is unmapped with reason not_listed.
# Labels seen in the sample (counted 2026-10-18, Stage 8; provisional, ADR-0008).

version = "label-mapping-sample-v1-2026-10-18"
dataset = "sample_v1"

