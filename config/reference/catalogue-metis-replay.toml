# Model catalogue for REPLAY: the test catalogue plus the logged models of the
# full dataset, so the todays_models baseline can price them
# (ADR-0041; FR-ACCT-02, FR-ACCT-07;
# ADR-0002, ADR-0026, ADR-0036). Used by config/evaluation/sprint.toml only;
# the live defaults keep catalogue-metis-test.toml.
#
# A copy of catalogue-metis-test.toml (its rows unchanged, below) plus one row
# per logged label priced in prices-metis-2026-10-18-logged.toml:
# - model_id and provider_model_name = the logged label exactly; provider = the
#   pricing page's provider for that row (docs/references/metis_pricing_2026-10-18.csv).
# - enabled = false: replay only, never called, never routed, never failover;
#   best_single_cheap still picks only among the enabled test models.
# - tier = 0 and equivalence_group = "replay-only" are PLACEHOLDERS the schema
#   requires (tier must be an integer); they say nothing about capability.
# - No context_window or max_output_tokens: unknown. No tokenizer_ref:
#   tokenizers.toml has no row for these models. No capabilities: unverified.
#
# Version history: "cat-metis-replay-2026-11-02" (Pipeline B) is this file:
# cat-metis-test-2026-10-18-s75-g55 plus 43 logged labels. Earlier history: see
# catalogue-metis-test.toml.

version = "cat-metis-replay-2026-11-02"

[[models]]
model_id = "gpt-5-nano"
provider = "openai"
provider_model_name = "gpt-5-nano"
# Reasoning model: hidden reasoning tokens are billed as output (brief §4).
capabilities = [{ name = "hidden_reasoning_billed_as_output", verified = true, evidence = { source = "OpenAI reasoning guide https://developers.openai.com/api/docs/guides/reasoning (reasoning tokens 'are billed as output tokens', 'not visible via the API'); model page lists reasoning token support", checked_on = 2026-10-18 } }]
context_window = { value = 400000, evidence = { source = "OpenAI model page https://developers.openai.com/api/docs/models/gpt-5-nano ('400,000 context window', '128,000 max output tokens')", checked_on = 2026-10-18 } }
max_output_tokens = { value = 128000, evidence = { source = "OpenAI model page https://developers.openai.com/api/docs/models/gpt-5-nano ('400,000 context window', '128,000 max output tokens')", checked_on = 2026-10-18 } }
tier = 0
equivalence_group = "metis-nano"
tokenizer_ref = "openai-o200k-base"
price_ref = "metis-gpt-5-nano"
enabled = true

