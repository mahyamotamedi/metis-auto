# Local decision-router models (ADR-XXXX (system-one-decision-router) point 7; decision router R5).
#
# Model files are fetched ONCE by `python scripts/fetch_router_assets.py`
# (network, explicit) into paths.router_assets (default data/routers/,
# git-ignored), into <ref>/<revision>/, and checked by sha256 before every
# load. Nothing is downloaded at run time or in tests: the THX-01 adapter sets
# the Hugging Face libraries offline and refuses an unpinned or incomplete
# checkpoint (thx01 would otherwise fall back to a Hub download).
#
# Pinning (the owner's machine; the project's own network cannot reach the Hub):
#   plan  - metadata only: resolves the revision, lists files and sizes.
#   pin   - downloads those files at that revision, verifies each against the
#           Hub's own tree at that commit (the LFS sha256 for large files, the
#           git blob id for small ones), computes sha256, and rewrites this
#           file with the pins (a dated version). Nothing is trusted on first
#           download.
#   fetch - downloads missing files of a pinned asset and checks sha256.
#   check - verifies the local files, no network.
#
# Until `pin` has run, the assets below are UNPINNED (no revision, no files)
# and the thx01 backend reports itself unavailable (missing_assets).

# THX-01: the repository root IS the multilingual model (mmBERT-base encoder,
# post-trained in 18 languages including Persian). There is no "multilingual"
# subfolder: R0 read that from a stale docstring of thx01.load() (corrected
# 2026-11-02, router_r0_findings.md §5). The asset lists exactly the files
# thx01 1.0.0 reads (agent.py, common.py); config.json is in thx01's own
# download allow-list but never read, so it is fetched (283 bytes) and not
# required. Only the root, encoder/ and tokenizer/ are listed: the demo and
# training folders (doom, snake, gen, bench, train, results, assets,
# .eval_results, thx01) are never listed or fetched.
#
# This header is kept when `pin` rewrites the file; the data below is not.

version = "routers-2026-11-03"

[[assets]]
ref = "thx01"
backend = "thx01"
model = "doofz/THX-01"
include = ["config.json", "rl_agent_config.json", "model.safetensors", "encoder/config.json", "tokenizer/tokenizer.json", "tokenizer/tokenizer_config.json"]
required = ["rl_agent_config.json", "model.safetensors", "encoder/config.json", "tokenizer/tokenizer.json", "tokenizer/tokenizer_config.json"]
revision = "b323afcef149f9288a9d0daef4badd67b9b87c61"
licence = "Apache-2.0"
library = "thx01==1.0.0"
evidence = { source = "Model card https://huggingface.co/doofz/THX-01 (read 2026-11-02: Apache-2.0, multilingual, base_model jhu-clsp/mmBERT-base, language list includes fa, post-trained in 18 languages with Persian among them, 0.3B params, F16 safetensors, up to 1,024 tokens per question, GPU latency about 10 ms, CPU latency not stated; MASSIVE-scenario fa 89.0, ECE 0.052, self-reported). Owner's browser 2026-11-02: main at commit b323afc, about 679 MB; root model.safetensors 644 MB, encoder/ holds only config.json, tokenizer/ holds tokenizer.json (34.4 MB) and tokenizer_config.json; no multilingual folder. Package thx01 1.0.0 (sdist sha256 6d1013b900ab30d4b8848b9c57e03e54e389e25c5f797df2aea9c6a69b18c8c3, read without running it): Agent reads rl_agent_config.json and model.safetensors (every weight, encoder included: it requires encoder.* tensors and loads strictly), builds the encoder from encoder/config.json (AutoModel.from_config, no weights) and the tokenizer from tokenizer/; a missing tokenizer/ or encoder/ would trigger a Hub download, which the pins and the offline flags prevent", checked_on = 2026-11-02 }

