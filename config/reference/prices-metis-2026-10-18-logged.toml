# mimo-v2.5 (Stage 7.5, Q-32): pricing page row "xiaomi,mimo-v2.5". The Metis
# MiMo wrapper page (saved the same day) shows lower figures (0.14 / 0.0028 /
# 0.28), about 10 % below: probably Xiaomi's list price. The pricing page is
# the price source for every model here. Xiaomi bills requests to mimo-v2.5
# at mimo-v2.6-flash prices since 2026-10-14 (mimo.mi.com/docs/en-US/updates/
# deprecate); what Metis charges after that switch is unverified (A-60).
price_ref = "metis-mimo-v2.5"
input = "0.154"
output = "0.308"
cached_input = "0.0031"

# gpt-5.4 has context-length tiers. The Metis page labels the first tier
# "≤ 270K context". Whether K means 1,000 or 1,024 (270,000 or 276,480 tokens)
# is not stated, and OpenAI's own model page (checked 2026-10-18) uses a
# different figure (">272K input tokens ... for the full session"). Chosen
# reading (conservative, ADR-0020): the cheaper tier ends at 270,000 input
# tokens, so a call is never priced below the bill; inputs of 270,001-276,480
# get the caveat context_tier_boundary_uncertain. "Context" is read as the
# call's input tokens, and the tier prices the whole call (OpenAI's "full
# session" rule). Re-verify on the next pricing-page check.
[[prices]]
price_ref = "metis-gpt-5.4"
tier = "standard"
max_input_tokens = 270000
max_input_tokens_uncertain_up_to = 276480
input = "2.875"
output = "17.25"
cached_input = "0.2875"

[[prices]]
price_ref = "metis-gpt-5.4"
tier = "long"
min_input_tokens = 270001
input = "5.75"
output = "25.875"
cached_input = "0.575"

# gpt-5.5 (E2, 2026-10-30): pricing page row "gpt-5.5", "raw" column; same
