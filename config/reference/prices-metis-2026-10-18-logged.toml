# Price table for REPLAY: the logged models of the full dataset, so the
# todays_models baseline stops being mostly unknown
# (ADR-0040; FR-ACCT-02, FR-ACCT-07;
# ADR-0002, ADR-0026, ADR-0036). Used by config/evaluation/sprint.toml only;
# the live defaults keep prices-metis-2026-10-18-g55.toml.
#
# A copy of prices-metis-2026-10-18-g55.toml (its rows unchanged, below) plus one
# row per logged label (label-mapping-full-v1.toml) that is a real text model
# AND has a pricing-page row under exactly the same model name. A label whose
# name differs from every page row, or that is not a text model, has no row
# here: its price stays unknown, never guessed.
#
# Source: Metis pricing page, https://metisai.ir/pricing, saved by the owner on
# 2026-10-18; extract committed as docs/references/metis_pricing_2026-10-18.csv.
# Amounts are taken from the CSV's `raw` column only.
# tests/unit/settings/test_logged_prices.py checks every new amount against
# that `raw` text.
#
# Token prices only. Per-call, search-query, web-search and audio-input prices
# are not token prices for this schema and are left out (named on each row).
# cache_write: "Cache Write Token" as one amount; Anthropic's "Cache Write (5m)"
# and "(1h)" as the ttl-5m / ttl-1h variants.
# No cached-input price on the page: cached_input = that row's input price
# (no discount assumed, an upper bound), noted on the row; never 0.
#
# Amounts are decimal STRINGS (exact), USD per 1,000,000 tokens.
# effective_from: unknown (the page states none). Re-verify before any budget
# decision. A change in price = a new file with a new version, never an edit.
#
# Version history: "prices-metis-2026-10-18-logged" (2026-11-02, Pipeline B) is
# this file: prices-metis-2026-10-18-s75-g55 plus 43 logged labels; no existing
# amount changed. Earlier history: see prices-metis-2026-10-18-g55.toml.

version = "prices-metis-2026-10-18-logged"
currency = "USD"
per_tokens = 1000000

[evidence]
source = "Metis pricing page https://metisai.ir/pricing, saved 2026-10-18; docs/references/metis_pricing_2026-10-18.csv (raw column)"
checked_on = 2026-10-18

