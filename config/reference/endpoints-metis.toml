# Provider endpoints through the Metis wrapper, one per model family.
# Config, not secrets: every family uses the same key, named by `secret`
# (the environment variable METIS_API_KEY). Summary and caveats:
# docs/references/metis_wrapper_api.md. All rows are documentation claims,
# verified by the Stage 7.5 live wrapper check.

version = "endpoints-metis-2026-10-18"

[[endpoints]]
family = "openai"
base_url = "https://api.metisai.ir/openai/v1"
api_format = "openai_chat_completions"
auth_header = "Authorization: Bearer"
secret = "metis_api_key"
status = "enabled"
evidence = { source = "https://metisai.ir/api/wrapper/openai (saved 2026-10-18)", checked_on = 2026-10-18 }

