# Context compressors (Demo milestone; context plan X3, ADR-0023). EXPERIMENTAL
# and unpromoted: no ablation evidence yet (FR-CTX-03), Persian quality unknown
# (trained on the English MeetingBank set). Off by default
# ([pipeline.context.compression] enabled = false).
#
# Model files are fetched ONCE by `python scripts/fetch_compressor_assets.py`
# (network, explicit) into paths.compressor_assets (default data/compressors/,
# git-ignored), into <ref>/<revision>/, and checked by sha256 before every
# load. Nothing is downloaded at run time or in tests (the adapter sets the
# Hugging Face libraries offline). Libraries: the optional extra `compress`
# (torch, transformers, llmlingua), never in the runtime lock.
#
# sha256: model.safetensors and tokenizer.json are LFS files whose sha256 the
# Hub lists (checked 2026-10-19); the small JSON files are not in LFS, so
# their pins were computed from our download on 2026-10-19
# (trust-on-first-download, recorded as such), as for the DeepSeek tokenizer.

version = "compressors-2026-10-19"

[[compressors]]
# The ref is also the local directory name, and it must contain
# "xlm-roberta-large": llmlingua 0.2.2 picks its word-boundary rules by a
# substring of the model path (llmlingua/utils.py is_begin_of_new_word).
ref = "llmlingua-2-xlm-roberta-large-meetingbank"
backend = "llmlingua2"
model = "microsoft/llmlingua-2-xlm-roberta-large-meetingbank"
revision = "ebaba9b0e874dadd3003ffcff828e4397e568089"
licence = "MIT"
library = "llmlingua==0.2.2"
evidence = { source = "Model card https://huggingface.co/microsoft/llmlingua-2-xlm-roberta-large-meetingbank (revision ebaba9b0, last modified 2025-01-08; licence MIT; XLMRobertaForTokenClassification, 24 layers, hidden 1024, max_position_embeddings 514; fine-tuned on microsoft/MeetingBank-LLMCompressed, English). Paper: Pan et al. 2024, arXiv 2403.12968. Library: llmlingua 0.2.2 on PyPI (MIT, released 2024-04-09), PromptCompressor(use_llmlingua2=True).compress_prompt_llmlingua2", checked_on = 2026-10-19 }

