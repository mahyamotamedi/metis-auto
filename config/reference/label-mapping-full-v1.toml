# fidelity: exact_id | alias (an alias applied at log time is unverified)
# unmapped: not_in_catalogue (a real model without a catalogue row) | not_a_model
#           (names no model) | not_a_text_model (image generation)
# Counts are requests (AI messages) on bots with that label, counted 2026-10-30.

