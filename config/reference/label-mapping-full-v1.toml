# Logged model labels of the full dataset (revision 30f578f2, bot.provider_model of bots
# used in sessions) -> catalogue models. New file; label-mapping-sample-v1.toml is unchanged.
#
# Labels are bot configuration, not billing entities and not proof of the model that
# served a message (the bot record is a single snapshot; see docs/full_eda). Mapping
# says only which catalogue/price row a label could be repriced with.
