# Local text rerankers for the reranker-cut cut-first item (a) (final plan R-A2;
# ADR-0040, ADR-0060; traces H-2,
# FR-CTX-02). PINNED 2026-11-04 (owner decision, re-checked against the Hugging
# Face API and the model card on the same day): the revision and the sha256 of
# every file the adapter loads. Nothing is downloaded by the repo until
# `python scripts/fetch_reranker_assets.py` is run on the GPU machine.
#
# Local GPU only, no data uploaded anywhere: weights are downloaded once by the
# fetch script (explicit, like installing a package), stored under
# data/rerankers/ (git-ignored), checked by sha256 before every load, and
# loaded offline. Libraries: the existing extra `compress` (torch,
# transformers), imported only in adapters/rerankers/bge_local.py (tested).
#
# sha256 sources: the three large files are LFS files whose sha256 the Hub API
# lists; config.json, tokenizer_config.json and special_tokens_map.json are not
# LFS files, so their pins were computed from our own download of just those
# three files at the pinned revision on 2026-11-04 (trust-on-first-download,
# recorded as such; sizes equal the Hub listing). The adapter loads, through
# transformers' AutoTokenizer and AutoModelForSequenceClassification: config.json,
# model.safetensors, tokenizer.json, tokenizer_config.json,
# special_tokens_map.json and sentencepiece.bpe.model (the slow-tokenizer file).
