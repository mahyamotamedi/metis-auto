# Application defaults (versioned). ADR-0019, docs/architecture/configuration.md.
#
# Layer 2 of 6. Lower: each policy's typed code defaults (domain). Higher:
# experiment file < runtime file (config/local.toml) < METIS__* environment
# overrides < explicit overrides. NEVER put a secret in this file.
#
# Every section and key below is validated by metis_auto.settings.Settings
# (unknown keys are errors), except [pipeline.*], which wiring validates
# against each policy's own config type.

[paths]
# Machine-local; relative paths resolve against the checkout root. Not hashed.
run_dir = "runs"
# Persistent, cumulative spend ledger (ADR-0018). Git-ignored. Never delete
# it: that would reset the lifetime total. Shared with the container via a
# bind mount (compose.yaml).
spend_ledger = "data/spend/ledger.jsonl"
recorded_dir = "data/recorded"

[logging]
level = "INFO"

[live]
# Live model calls are off by default (ADR-0003). Turn on only in a runtime
# layer (config/local.toml or METIS__LIVE__ENABLED=true), never in an
# experiment file. The live client (Stage 7.5, extra `live`) is built only
# when the run also asks for counterfactual_source = "live" and both caps and
# METIS_API_KEY are set (wiring.from_settings.live_permission).
enabled = false

[budget]
# ADR-0018. Amounts are decimal strings in `currency`.
currency = "USD"
# Hard ceiling for the whole project. May be set ONLY in this file; raising it
# needs a reviewed commit and a decision record. 20 USD = the Metis account
# credit (owner decision 2026-11-01, ADR-0018 amendment 2).
lifetime_ceiling = "20"
# Lifetime cap across all runs (<= ceiling). Live calls are refused without it.
# 20 USD = the Metis account credit (owner decision 2026-11-01, ADR-0018
# amendment 2; it was 10, the dashboard limit of Q-29, amendment 1). The golden
# answers for golden-v2 (ADR-0030) are estimated at 15 to 19 USD and fit within
# it. If a run runs short it halts; after a top-up a new amendment raises both
# values, and the run resumes.
lifetime_cap = "20"
# Per-run cap (<= lifetime cap). Placeholder proposed in Stage 6 (A-49).
run_cap = "1"
# Operator warnings when lifetime spend crosses these fractions of the cap.
warn_at = [0.5, 0.8]

[reference]
# Paths relative to the config directory. Each file carries its own version
# ID, which goes into the config hash and every event (FR-OBS-02).
catalogue = "reference/catalogue-metis-test.toml"
prices = "reference/prices-metis-2026-10-18-g55.toml"
endpoints = "reference/endpoints-metis.toml"
baselines = "reference/baselines.toml"
# Logged label → catalogue model for the as-logged baseline (Stage 8).
label_mapping = "reference/label-mapping-sample-v1.toml"

[experiment]
name = "default"
# fake | logged_match | recorded | live | proxy (ADR-0014). `live` is the
# first of the two keys; [live].enabled is the second.
counterfactual_source = "fake"
seed = 0

[embedding]
# Semantic tier (Stage 8). `fake` is offline.
backend = "fake"

[database]
# Local PostgreSQL (ADR-0027), read by the ingestion and dataset scripts. Serving
# never reads it. The password is the secret METIS_DB_PASSWORD, never set here.
enabled = false
host = "localhost"
port = 5432
name = "metis"
user = "metis"

[dev]
# Without METIS_FINGERPRINT_KEY, use a random key per process (A-44).
ephemeral_fingerprint_key = true

# --- Decision router, System One (ADR-XXXX (system-one-decision-router)). Infrastructure only: the routing
# POLICY knobs (gate rules, mapping thresholds, criteria, hysteresis, state
# truncation, safe tier) arrive in R3 under [pipeline.routing.decision_router].
# Every value is a PLACEHOLDER until exp-route-013 gives evidence. Serving
# default: mode = "off" (no router is built; routing is unchanged).
# Switch per run: config/local.toml, or the environment override
#   PowerShell:  $env:METIS__ROUTER__MODE = "local"
# router.real_data_approved and router.allow_unpriced are RUNTIME-ONLY keys:
# this file and experiment files may not set them (the loader refuses).
[router]
mode = "off"                 # off | hosted | local | hybrid_local_first | hybrid_hosted_first
deadline_ms = 60             # local router's own p95 budget inside the 100 ms overhead (Q-14)
deadline_grace_ms = 10
reserved_pipeline_ms = 0
min_confidence = 0.6
keep_soft_signals = false
escalate_on_low_confidence = false   # A-103: true = ask the next backend (R8 compares)
confidence_questions = "mapping"     # Q-61 (owner 2026-11-03): gate on complexity, needs_reasoning, cheap_model_ok; "all" adds intent
question_set = "routing_qs_v1"
question_language = "en"     # en | fa (A/B)

[router.cache]
enabled = true
max_entries = 10000
ttl_s = 86400
normalisation = "persian_fold_v1"   # an ADR-0025 treatment

[router.circuit]
failure_threshold = 3
window_s = 60
cooldown_s = 30

# Backends. `type` selects the adapter; all disabled by default.
[router.backends.jev_metis]
# Jev via https://api.metisai.ir/typesafe/v1/systemone (Metis page saved
# 2026-11-02). Shadow runs and labelling only (owner, 2026-11-02); SYNTHETIC
# or owner-written text only. Price: reference/prices-metis-router-2026-11-02.toml
# (Metis pricing page, checked by the owner 2026-11-02; never TypeSafe's direct
# price). Only jev-latest is offered: every result records the version the
# response reports (model_revision); a change of version invalidates the
# router cache (ADR-XXXX (system-one-decision-router)).
type = "jev_metis"
enabled = false
base_url = "https://api.metisai.ir/typesafe"   # posts to /v1/systemone; not OpenAI-compatible
model = "jev-latest"
price_ref = "metis-jev-latest"
timeout_ms = 1500

[router.backends.llm_system_one]
# Backup for Mode 1: a chat model answering in JSON (uncalibrated).
# gpt-4o-mini since 2026-11-03: Metis answered gpt-4.1-nano with HTTP 404
# model_not_found in the R6 live check (TODO-17).
type = "llm_system_one"
enabled = false
model_id = "gpt-4o-mini"
max_output_tokens = 300
timeout_ms = 2000

[router.backends.thx01]
# Mode 2 default: THX-01 (multilingual mmBERT model), in-process, offline (R5).
type = "thx01"
enabled = false
asset = "thx01"              # row in reference/routers.toml (sha256 pins)
runtime = "torch"            # torch | onnx (int8 fallback, only if torch misses 60 ms)
threads = 4
timeout_ms = 60

[router.backends.mizan_http]
# Mizan-1.5-4B on a local llama-server (loopback only). Shadow and offline
# evaluation only: never inline on CPU (owner, 2026-11-02).
type = "systemone_http"
enabled = false
base_url = "http://127.0.0.1:8080"
model = "mizan-1.5-4b-q4_k_m"
health_path = "/health"
health_timeout_ms = 200
timeout_ms = 400

[router.chains]
local = ["thx01"]
hosted = ["jev_metis"]
hybrid_local_first = ["thx01", "jev_metis"]
hybrid_hosted_first = ["jev_metis", "thx01"]

# --- Provider request options per model (Stage 7.5, Q-34; ADR-0021). None
# are set: every model runs with its provider's default (DeepSeek and MiMo:
# thinking enabled). Allowed per family by `request_options` in
# endpoints-metis.toml. Example, for an experiment or config/local.toml:
#   [model_options."deepseek-v4-flash"]
#   thinking = "disabled"
# Gemini (native adapter; endpoint deferred, no catalogue row yet): every
# model needs an explicit thinking_budget (tokens, >= 0). Unset = the adapter
# refuses to call, so nothing thinks at the provider's default. Thinking
# tokens bill as output. ADR-0043.

# --- Policy selection (promoted components only; repository_structure §6.2).
# Thresholds not listed here keep their typed code defaults (A-43:
# placeholders, not evidence). Any of them can be overridden by a higher layer.
[pipeline.routing]
# fixed_model (default: one model), rule_based (rules below, per request), or
# sticky (sticky routing v1 or per_request, below). rule_based and sticky are
# DEMO components (Demo milestone, ADR-0023): placeholders until the
# routing-plan experiments (exp-route-002, exp-route-010) give evidence. The
# serving default stays fixed_model; scripts/chat.py starts in sticky.
policy = "fixed_model"

[pipeline.routing.fixed_model]
model_id = "gpt-4o-mini"

[pipeline.routing.sticky]
# sticky_v1 (owner brief §7) or per_request (the rules on every message).
mode = "sticky_v1"
# Router for first and re-routed messages: rule_based (unchanged) or
# decision_router (ADR-XXXX (system-one-decision-router): adds hysteresis from [pipeline.routing.decision_router.hysteresis]).
inner = "rule_based"
# "Very different" message → re-route and re-anchor: code appears or
# disappears, a coding intent appears (A-71), an attachment appears, the language switches, or the length
# bucket moves by at least this many buckets (placeholder).
length_bucket_jump = 2
language_switch = true

[pipeline.routing.decision_router]
# System-One decision router POLICY (ADR-XXXX (system-one-decision-router); infrastructure is [router]).
# Selected with policy = "decision_router" (or as sticky's inner router). Every
# number is a PLACEHOLDER (A-43 style), tuned on the dev slice's tune split only.
# Path: gate (fast) → answers (slow or router cache) → rules → safe tier.
version = "0.1.0"
safe_tier = 1                   # when no answer fires and only the default rule matches
undetermined = "safe_tier"      # or "rules_default"

[pipeline.routing.decision_router.gate]
greeting_tier = 0               # greeting or small talk (configured phrase list)
code_tier = 1                   # code present, or coding intent without code
attachment_tier = 1
long_message_chars = 2000
long_message_tier = 1

[pipeline.routing.decision_router.state]
max_message_chars = 1000
max_previous_turn_chars = 300   # 0 = never send the previous user turn
# fold = "persian_fold_v1"      # unset: the text as written

[pipeline.routing.decision_router.mapping]
tau_complex = 2.0               # complexity score (0..3) at or above → high tier
tau_reason = 0.6                # P(needs multi-step reasoning) at or above → high tier
tau_ok = 0.7                    # P(a small model is enough) at or above, with ...
tau_conf = 0.6                  # ... the complexity answer's confidence at or above → low tier
high_tier_intents = ["code", "math_reasoning", "analysis"]
low_tier = 0
high_tier = 1
use_soft_signals = false

[pipeline.routing.decision_router.criteria]
long_context_tokens = 32000     # known input at or above → at least long_context_min_tier
long_context_min_tier = 1
# fast_model_deadline_ms = 3000 # unset: off (no catalogue model has a verified low_latency capability)
# max_effective_cost_per_answer = "0.002"   # unset: off (flag only)
# max_tier = 1

[pipeline.routing.decision_router.effort]
models = ["gpt-5-nano"]         # where reasoning_effort is sent (OpenAI family)
low_below = 0.3                 # P(needs reasoning) under this → low_effort
low_effort = "minimal"
# high_effort = "medium"        # unset: the model's default

[pipeline.routing.decision_router.hysteresis]
downgrade_after_n = 2           # low-complexity user turns before going down
tau_hist = 0.5                  # P(depends on history) at or above → stay on the anchor
low_turn_max_length_bucket = 1

[pipeline.routing.rule_based]
# PLACEHOLDER rules (A-43 style; not tuned, no quality evidence). First match
# wins; the tier's cheapest model by EFFECTIVE cost is chosen (cost_model).
# Tiers are the catalogue's price-based placeholders (A-48): 0 = gpt-5-nano,
# gpt-4.1-nano, mimo-v2.5; 1 = gpt-4o-mini, deepseek-v4-flash. The escalation
# chain is the cheapest model of each higher tier.
version = "rules-demo-2026-10-19"
default_tier = 0

[[pipeline.routing.rule_based.rules]]
id = "attachment"
when = { has_attachments = true }
tier = 1

[[pipeline.routing.rule_based.rules]]
id = "code"
when = { has_code = true }
tier = 1

[[pipeline.routing.rule_based.rules]]
id = "coding_intent"
# Asks for code or programming help with no code in the message
# ([pipeline.features.coding_intent]; placeholder, A-71): same tier as code.
when = { has_coding_intent = true }
tier = 1

[[pipeline.routing.rule_based.rules]]
id = "long_message"
# length bucket 2 = 400 characters or more ([pipeline.features] bounds)
when = { length_bucket_min = 2 }
tier = 1

[[pipeline.routing.rule_based.rules]]
id = "deep_session"
when = { turn_depth_min = 8 }
tier = 1

[pipeline.routing.rule_based.cost_model]
# Effective cost per answer = estimated input + assumed visible output +
# expected HIDDEN REASONING (billed as output; routing plan §3). The nominal
# price alone would rank gpt-5-nano cheapest; with its reasoning it is not.
# PLACEHOLDERS from one tiny synthetic live check each (2026-10-18,
# docs/references/metis_wrapper_live_check.md): gpt-5-nano billed 256, 64, and
# 128 reasoning tokens (mean ≈ 150); deepseek-v4-flash 30; mimo-v2.5 10-13.
# Short answers only: real reasoning varies with the request. A model whose
# [model_options] disable thinking gets 0 (wiring). A model that bills
# reasoning and is not listed gets default_reasoning_tokens.
assumed_output_tokens = 300
default_reasoning_tokens = 256
expected_reasoning_tokens = { "gpt-5-nano" = 150, "deepseek-v4-flash" = 30, "mimo-v2.5" = 12 }

[pipeline.features]
# Cheap detectors (Demo milestone; placeholders). Length buckets in characters:
# 0 below 80, 1 below 400, 2 below 2,000, 3 from 2,000.
length_bounds = [80, 400, 2000]

[pipeline.features.coding_intent]
# Coding INTENT (A-71; PLACEHOLDER word lists, not tuned): the message asks for
# code or programming help and has NO code (code presence is the separate
# code detector). True when a template matches, or when a keyword (after
# removing exclude_phrases; their last word also matches with a suffix,
# «کد تخفیفم») and a request cue both appear: "I studied python"
# has no cue and is no. Whole words after casefolding, Persian letter folding,
# ZWNJ → space, and removing punctuation; "..." in a template = up to max_gap
# words. Known false positives: a customer's "how do I fix this payment
# error" (error + how) and «برنامه» in the sense "plan".
max_gap = 4
keywords = [
    "python", "javascript", "typescript", "java", "function", "code", "script",
    "bug", "error", "exception", "sql", "regex", "html", "css", "json", "api",
    "algorithm", "compile", "compiler", "debug", "programming",
    "کد", "برنامه", "تابع", "اسکریپت", "خطا", "باگ", "ارور", "پایتون",
    "جاوااسکریپت", "الگوریتم", "دیباگ", "برنامه نویسی",
    # Whole words only («کد» must not match «کدام»), so common inflections:
    "خطای", "کدم", "کدش", "کدی", "باگش",
]
request_cues = [
    "write", "fix", "debug", "help", "how", "why", "can you", "could you",
    "please", "implement", "create", "generate", "convert", "explain", "show me",
    "refactor", "optimize", "what is wrong", "not working",
    "بنویس", "بنویسید", "بنویسی", "درست کن", "درست کنم", "رفع", "حل", "کمک",
    "چطور", "چطوری", "چگونه", "چرا", "توضیح", "لطفا", "میشه", "می شه",
]
templates = [
    "write ... function", "write ... script", "write ... code", "write ... program",
    "write ... query", "write ... regex", "fix ... error", "fix ... bug",
    "fix ... code",
    "تابع ... بنویس", "کد ... بنویس", "اسکریپت ... بنویس", "برنامه ... بنویس",
    "خطا ... رفع", "باگ ... رفع", "باگ ... درست",
]
# Shop uses of "code" that are not programming (removed before keywords).
exclude_phrases = [
    "discount code", "promo code", "coupon code", "tracking code", "postal code",
    "zip code", "کد تخفیف", "کد رهگیری", "کد پیگیری", "کد پستی", "کد ملی",
]

[pipeline.features.greeting]
# Greetings and small talk (owner brief §7): such a message goes to the
# cheapest model and does not anchor the session. Matched after casefolding,
# Persian/Arabic letter folding, and removing punctuation and emoji; the whole
# message must be made of these phrases and at most max_chars long. Never
# "short = trivial". Answers like "yes"/"no" are left out on purpose (they
# answer the bot and may be substantive).
max_chars = 40
phrases = [
    "سلام", "سلام علیکم", "درود", "وقت بخیر", "صبح بخیر", "عصر بخیر", "شب بخیر",
    "روز بخیر", "خوبی", "خوبید", "خوبین", "چطوری", "مرسی", "ممنون", "ممنونم",
    "متشکرم", "سپاس", "سپاسگزارم", "تشکر", "خیلی ممنون", "خیلی مرسی", "دمت گرم",
    "قربانت", "خداحافظ", "خدانگهدار", "بای", "باشه", "اوکی", "اکی", "حله",
    "hi", "hello", "hey", "hiya", "good morning", "good afternoon", "good evening",
    "good night", "thanks", "thank you", "thanks a lot", "thank you very much",
    "many thanks", "thx", "ty", "cheers", "ok", "okay", "cool", "great", "nice",
    "bye", "goodbye", "see you",
]

[pipeline.cache]
# Serving defaults (ADR-0007, ADR-0011): session scope, the full key.
scope = "session"
# DEMO ONLY (ADR-0023): "demo_bot_level" shares entries across users of one
# bot (global scope only when instructions are present; ADR-0016 S-b shape).
# Never the serving default.
scope_rule = "fixed"

[pipeline.cache.demo_seed]
# DEMO ONLY (ADR-0023): logged first-turn sample answers under a message-only
# key, shown locally, never sent to a provider. Off by default.
enabled = false

[pipeline.context]
strategy = "pass_through"
# Generation limit actually requested (reasoning included) and reserved in the
# spend guard's pre-call estimate, below each model's own output limit
# (Stage 7.5; provisional, A-43-style placeholder). 4,096 output tokens cost
# at most 0.0027 USD on the dearest test model (0.66 USD / 1M).
max_output_tokens_cap = 4096

[pipeline.context.compression]
# EXPERIMENTAL (Demo milestone, context plan X3, ADR-0023): LLMLingua-2 on
# history and retrieved context, never instructions (compress_instructions
# stays false) and never the current message. Off by default. Needs the extra
# `compress` (requirements-compress.lock) and the model files
# (scripts/fetch_compressor_assets.py). Persian quality is unknown.
enabled = false
compressor = "llmlingua-2-xlm-roberta-large-meetingbank"
rate = 0.5
min_chars = 200
compress_instructions = false
