# UI strings of the demo (spec UI-V06): one key, every language (fa, en).
# Read through metis_auto.wiring.ui_config.load_strings; pages hold no text of
# their own. Stage 1 holds the Results page (D-2); Stage 2 (2026-11-03) adds the
# header, the shell and the chat page. Stage 2b (2026-11-03) adds the texts built
# by wiring.demo_ui ([demo_ui]: banner details, per-message detail rows, failure
# texts, cost term names, routing badges); their English is unchanged.
# Persian strings are [PLACEHOLDER: Persian review] until reviewed (K-2/K-3):
# written by the agent, not by a Persian reviewer. Format fields in braces.

