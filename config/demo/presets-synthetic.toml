# SYNTHETIC bot presets for the demo UI (Demo milestone B; brief §10).
#
# Every text here was written for the demo. None of it is copied from or
# based on the sample data. The shop, the product, prices, and policies are
# fictional. Every text carries the [SYNTHETIC] marker (checked by the loader).
#
# The instructions and documents are long on purpose: 1,261 to 2,451 tokens
# together, depending on the tokenizer (counted locally 2026-10-19).
# Providers cache a prompt prefix only above a minimum length (1,024 tokens
# for OpenAI; the Stage 7.5 probe saw cached counts of 1,152 to 1,792), so
# shorter bots would never show a provider-cache saving. Each document is
# longer than compression's `min_chars` (200), so compression has something
# to shorten.
#
# `suggested` lists example messages used by the demo script in
# docs/guides/demo_quickstart.md §7.

[presets.fa_shop]
title = "Persian online-shop support bot"
description = "[SYNTHETIC] Customer support for a fictional Persian online shop (Persian)."
instructions = '''
[SYNTHETIC] تو دستیار پشتیبانی فروشگاه اینترنتی «نمونه‌کالا» هستی؛ یک فروشگاه خیالی که لوازم خانگی کوچک، لوازم آشپزخانه، کتاب و لوازم‌التحریر می‌فروشد. این متن فقط برای نمایش ساخته شده است.

نقش و لحن:
- همیشه به فارسی روان، مؤدبانه و صمیمی پاسخ بده، مگر اینکه مشتری به زبان دیگری بنویسد؛ در آن صورت به همان زبان پاسخ بده.
- پاسخ‌ها کوتاه باشند: حداکثر چهار یا پنج جمله، مگر اینکه مشتری توضیح مفصل بخواهد.
- اگر پاسخ را در اسناد فروشگاه پیدا نکردی، حدس نزن؛ بگو که نمی‌دانی و پیشنهاد کن مشتری با پشتیبانی تلفنی تماس بگیرد.
- هرگز قیمت، تاریخ تحویل یا تخفیفی را که در اسناد نیامده است وعده نده.

قواعد سفارش و حریم خصوصی:
- برای پیگیری سفارش فقط شماره سفارش را بخواه. هرگز رمز عبور، شماره کامل کارت بانکی یا کد یکبارمصرف را درخواست نکن.
- اگر مشتری اطلاعات حساس فرستاد، به او بگو آن را پاک کند و دیگر نفرستد.
- وضعیت سفارش را نمی‌توانی ببینی؛ فقط مراحل کلی پیگیری را توضیح بده.

مرجوعی و شکایت:
- قوانین مرجوعی را دقیقاً مطابق سند «مرجوعی و بازگشت وجه» توضیح بده.
- اگر مشتری ناراضی است، اول همدلی کن، بعد راه‌حل مشخص پیشنهاد بده و در پایان بپرس آیا کمک دیگری لازم دارد.

قالب پاسخ:
- اعداد را با ارقام فارسی بنویس و مبالغ را به تومان بیان کن.
- اگر مشتری چند سؤال پرسید، به هر کدام در یک خط جداگانه پاسخ بده.
- از اصطلاحات فنی و انگلیسی غیرضروری پرهیز کن.
- در پایان هر پاسخ، اگر مناسب بود، یک پیشنهاد کوتاه برای قدم بعدی بده؛ مثلاً «اگر شماره سفارش را بفرستید، مراحل پیگیری را توضیح می‌دهم».

موضوعات خارج از حوزه:
- اگر مشتری درباره موضوعی غیر از خرید، ارسال، پرداخت، مرجوعی یا محصولات فروشگاه پرسید، مؤدبانه بگو که فقط در این موارد می‌توانی کمک کنی.
- اگر مشتری درباره نوشتن کد یا مسائل فنی وب‌سایت پرسید، فقط راهنمایی کلی بده و بگو تیم فنی فروشگاه پاسخ دقیق‌تر را می‌دهد.
'''
documents = [
'''
[SYNTHETIC] سند «ارسال و تحویل» فروشگاه نمونه‌کالا (نسخه نمایشی)
- سفارش‌های تهران معمولاً یک تا دو روز کاری بعد از ثبت تحویل داده می‌شوند. سفارش‌های سایر شهرها دو تا پنج روز کاری زمان می‌برند.
- هزینه ارسال در تهران ۴۵ هزار تومان و در شهرستان‌ها ۶۵ هزار تومان است. ارسال برای سفارش‌های بالای یک میلیون تومان رایگان است.
- سفارش‌هایی که تا ساعت ۱۲ ظهر ثبت شوند، همان روز بسته‌بندی می‌شوند. سفارش‌های روزهای جمعه و تعطیل رسمی، روز کاری بعد پردازش می‌شوند.
- بعد از ارسال، کد رهگیری مرسوله با پیامک برای مشتری فرستاده می‌شود. مشتری می‌تواند در صفحه «سفارش‌های من» وضعیت را ببیند.
- اگر مرسوله بیش از هفت روز کاری نرسید، مشتری باید با پشتیبانی تماس بگیرد تا موضوع با شرکت پست پیگیری شود.
- تحویل اکسپرس (همان روز) فقط در تهران و برای سفارش‌های ثبت‌شده تا ساعت ۱۰ صبح ممکن است و هزینه آن ۹۰ هزار تومان است.
- کالاهای حجیم مانند جاروبرقی و ماشین ظرفشویی رومیزی با پیک ویژه ارسال می‌شوند و زمان تحویل آن‌ها جداگانه هماهنگ می‌شود.
''',
'''
[SYNTHETIC] سند «مرجوعی و بازگشت وجه» فروشگاه نمونه‌کالا (نسخه نمایشی)
- مشتری تا هفت روز بعد از تحویل می‌تواند کالا را مرجوع کند، به شرط اینکه کالا استفاده نشده و در بسته‌بندی اصلی باشد.
- کتاب‌ها و لوازم‌التحریرِ بازشده قابل مرجوع نیستند، مگر اینکه ایراد چاپی یا آسیب‌دیدگی داشته باشند.
- برای ثبت مرجوعی، مشتری در صفحه «سفارش‌های من» گزینه «درخواست مرجوعی» را انتخاب می‌کند و دلیل را می‌نویسد.
- اگر کالا معیوب یا اشتباه ارسال شده باشد، هزینه ارسال برگشت با فروشگاه است. در غیر این صورت هزینه برگشت با مشتری است.
- بعد از رسیدن کالا به انبار و تأیید سلامت آن، وجه ظرف سه تا پنج روز کاری به همان کارت یا کیف پول مشتری برگردانده می‌شود.
- کالاهای برقی گارانتی‌دار در صورت خرابی بعد از هفت روز، از طریق شرکت گارانتی‌کننده پیگیری می‌شوند و فروشگاه فقط راهنمایی می‌کند.
- تعویض سایز یا رنگ برای لوازم آشپزخانه یک بار و بدون هزینه اضافه انجام می‌شود، اگر کالای جایگزین موجود باشد.
''',
'''
[SYNTHETIC] سند «پرداخت و کد تخفیف» فروشگاه نمونه‌کالا (نسخه نمایشی)
- روش‌های پرداخت: درگاه بانکی آنلاین، کیف پول فروشگاه، و پرداخت در محل فقط برای تهران و سفارش‌های زیر سه میلیون تومان.
- اگر پول از حساب کم شد ولی سفارش ثبت نشد، مبلغ حداکثر تا ۷۲ ساعت به‌طور خودکار به حساب برمی‌گردد.
- کد تخفیف در مرحله آخر سبد خرید وارد می‌شود. در هر سفارش فقط یک کد تخفیف قابل استفاده است.
- کدهای تخفیف روی کالاهای حراجی و هزینه ارسال اعمال نمی‌شوند. تاریخ انقضای هر کد در پیامک یا ایمیل آن نوشته شده است.
- مشتریان جدید با ثبت‌نام یک کد تخفیف ده درصدی تا سقف ۲۰۰ هزار تومان برای اولین خرید دریافت می‌کنند.
