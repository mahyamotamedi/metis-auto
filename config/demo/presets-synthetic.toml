[presets.en_faq]
title = "English FAQ bot (software product)"
description = "[SYNTHETIC] FAQ assistant for a fictional note-taking app (English)."
instructions = '''
[SYNTHETIC] You are the FAQ assistant for "DemoNotes", a fictional note-taking app for desktop, web, and mobile. This product and everything below are invented for a demo.

Role and tone:
- Answer in clear, friendly English. If the user writes in another language, answer in that language.
- Keep answers short: at most five sentences or a short list, unless the user asks for detail.
- Answer only from the documents provided. If the documents don't cover the question, say so and suggest contacting support through the in-app Help menu.
- Never invent features, prices, release dates, or limits that are not in the documents.

Accounts and privacy:
- Never ask for passwords, recovery codes, or payment card numbers. If a user shares one, tell them to remove it and to change the password.
- You cannot see a user's account, notes, or billing. Explain the steps; don't claim to have checked anything.

Troubleshooting style:
- For sync or login problems, give numbered steps from the troubleshooting document, simplest first.
- Ask one clarifying question if the platform (Windows, macOS, Linux, web, iOS, Android) matters and is not stated.
- If the user pastes an error message, explain what it most likely means according to the documents, then give the next step.

Developer questions:
- DemoNotes has a public REST API (see the API document). You may explain endpoints, authentication, and limits from the document.
- When a user asks for code, give a short, self-contained example in the language they ask for (Python by default), using only the endpoints in the document, and remind them to keep their API token secret.

Format:
- Use Markdown lists for steps. Put code, file paths, and settings names in backticks.
- End with one short suggestion for a next step when it helps.

Out of scope:
- Politely decline questions unrelated to DemoNotes (general news, other products, personal advice) and say what you can help with instead.
'''
documents = [
'''
[SYNTHETIC] DemoNotes plans and billing (demo document)
- Free plan: up to 3 devices, 500 notes, 100 MB of attachments, 30 days of version history. No API access.
- Plus plan: 4 USD per month or 40 USD per year. Unlimited devices and notes, 10 GB of attachments, 1 year of version history, PDF export, and API access with 1,000 requests per day.
- Team plan: 8 USD per user per month, billed yearly, minimum 3 users. Everything in Plus, shared workspaces, admin console, SSO with SAML 2.0, audit log, and 10,000 API requests per day per workspace.
- Upgrades take effect immediately and are prorated. Downgrades take effect at the end of the billing period; notes above the Free limits become read-only, never deleted.
- Refunds: annual plans can be refunded within 14 days of purchase. Monthly plans are not refunded but can be cancelled at any time.
- Students and teachers get 50% off Plus with a verified school email address.
- Invoices are available under Settings > Billing > Invoices and can include a company name and VAT number.
''',
'''
[SYNTHETIC] DemoNotes sync and login troubleshooting (demo document)
1. Check the sync indicator in the bottom-left corner. Green means synced; orange means pending; red means an error. Click it to see the last error code.
2. Error SYNC-401 means the session expired: sign out and sign in again. Error SYNC-409 means a conflict: DemoNotes keeps both versions and marks the newer one "conflicted copy".
3. Error SYNC-413 means an attachment is larger than 200 MB, the per-file limit on every plan. Split or compress the file.
4. Error SYNC-429 means too many changes in a short time (for example, a bulk import). Sync resumes automatically after 10 minutes.
5. On desktop, make sure the system clock is correct; a clock more than 5 minutes off causes login error AUTH-SKEW.
6. If notes are missing on one device only, use Settings > Sync > Rebuild local cache. This re-downloads everything and does not delete server data.
7. Corporate networks: DemoNotes needs outbound HTTPS to sync.demonotes.example on port 443. Proxies that inspect TLS can cause error NET-TLS.
8. Two-factor authentication: if the authenticator app is lost, use one of the recovery codes shown at setup. Support cannot bypass two-factor authentication.
''',
'''
[SYNTHETIC] DemoNotes export, import, and REST API (demo document)
- Export: File > Export supports Markdown (all plans), HTML (all plans), and PDF (Plus and Team). A full-account export produces a ZIP with one folder per notebook.
- Import: Markdown files, HTML, plain text, and ENEX files from other note apps. Attachments up to 200 MB each are imported.
- API base URL: https://api.demonotes.example/v2 (a demo address that does not exist). Authenticate with a personal API token in the header "Authorization: Bearer <token>". Create tokens under Settings > Developer.
- Endpoints: GET /notes (list, paginated with ?page= and ?per_page= up to 100), GET /notes/{id}, POST /notes (fields: title, body_markdown, notebook_id, tags), PATCH /notes/{id}, DELETE /notes/{id} (moves to trash for 30 days), GET /notebooks, GET /search?q=.
- Rate limits: Plus 1,000 requests per day; Team 10,000 per workspace per day. Exceeding a limit returns HTTP 429 with a Retry-After header.
- Webhooks (Team only): note.created, note.updated, note.deleted, delivered as JSON with an HMAC-SHA256 signature in the X-DemoNotes-Signature header.
- Tokens can be revoked at any time; a revoked token returns HTTP 401 immediately.
''',
]
suggested = [
    "hi",
    "How do I export my notes to PDF?",
    "Does the Team plan include SSO?",
    "thanks!",
    "write a python function that lists all my notes with the API",
    "My sync shows SYNC-409, what does it mean?",
]
