# Alembic for the local PostgreSQL (ADR-0027). The URL comes from settings and
# METIS_DB_PASSWORD in env.py; it is never written here.
# Run from the repo root: .venv/bin/alembic -c infra/db/alembic.ini upgrade head
[alembic]
script_location = %(here)s
version_locations = %(here)s/versions
path_separator = os

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
